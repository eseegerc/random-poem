<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poemota</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tu Poema del Día</h1>
        <p class="subtitle">Dein Gedicht des Tages</p>

        <!-- Poema aparecerá aquí -->
        <div id="poem" class="poem"></div>

        <!-- Botón para mostrar poema -->
        <button id="newPoemBtn">Ver otro poema</button>
    </div>

    <!-- JS con cache-buster -->
    <script src="script.js?v=1"></script>
    <script>
        // Mostrar poema solo al hacer click
        document.getElementById('newPoemBtn').addEventListener('click', showPoem);
    </script>
</body>
</html>
